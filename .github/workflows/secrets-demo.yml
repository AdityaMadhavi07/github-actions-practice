name: Secrets-Demo

on:
  workflow_dispatch:
  push:
    pahs:
      - "github/workflows/secrets-demo.yml"

jobs:
  secret-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Check whether secret is configured
        env:
          My_Secret_Message: ${{ secrets.My_Secret_Message}}
        run: |
          if[-n "$My_Secret_Message" ]; then
            echo "the Secret is set: true"
          else
            echo "The secret is set: flase"
            exit 1
          fi

      - name: Demonstarting Github secret Making
        env:
          My_Secret_Message: ${{ secrets.My_Secret_Message }}
        run: |
          echo "Github maskde output: $My_Secret_Message"
