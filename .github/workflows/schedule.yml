name: Manual Environment Workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select the target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  show-environment:
    runs-on: ubuntu-latest

    steps:
      - name: Print selected environment
        run: echo "Selected environment is ${{ inputs.environment }}"
